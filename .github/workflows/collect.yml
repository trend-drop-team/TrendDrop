# 매시간 5개 소스(dcbest·theqoo·instiz·youtube·gtrends)를 긁어 raw_signals에 쌓는다.
# 로컬 launchd(com.trendrising.hourly)가 하던 일을 그대로 넘겨받는 자리다.
#
# ★ 이 워크플로는 Claude API를 쓰지 않는다. LLM 판정은 rank.yml에 있다.
#   그래서 매시간 돌려도 Anthropic 비용이 0이고, 대신 버킷 해상도를 지킬 수 있다.
#   수집을 거르면 그 시간대의 글은 이미 사라져서 나중에 복구할 방법이 없다.
#   (반대로 rank는 원문만 있으면 언제든 다시 계산된다 → rank.yml은 2시간 주기)
#
# 문서: pipeline/PIPELINE.md 8-3

name: collect (hourly)

on:
  # 유일한 트리거다. 외부 스케줄러(cron-job.org)가 매시 :05에
  # workflow_dispatch API를 호출해서 이 워크플로를 실행한다.
  # 이 방식은 사람이 "Run workflow" 버튼을 누른 것과 같은 취급이라
  # 혼잡 큐에 서지 않고 즉시 실행된다.
  #
  # ★ GitHub의 schedule:은 일부러 지웠다. 못 쓸 수준이어서다.
  #   2026-08-26~09-30 실측 — cron "5 * * * *"(기대 24회/일)로 걸어둔 것이
  #   실제로는 하루 5.75회(24%)만 실행됐다. 간격 중앙값 4.1h, 최대 13.1h.
  #   실패 0회 · 실행시간 중앙값 0.7분 · 큐 대기 0분이라 우리 쪽 문제가 아니다.
  #   같은 기간 rank.yml(2시간 주기)도 하루 5.31회 — cron 식을 뭐라고 쓰든
  #   이 레포엔 하루 5~6번만 떨어졌다. schedule은 best-effort라 혼잡하면
  #   지연되고, 밀린 회차는 소급 없이 버려진다(정각 부근이 최대 혼잡).
  #   결과적으로 raw_signals의 1시간 버킷이 14일 기준 76/336(23%)만 찼다.
  #
  # ★ 예비선으로 남겨두지도 않았다. 남기면 주 트리거가 죽었을 때도 하루 5번은
  #   계속 돌아서 "절반만 살아있는 상태"를 가린다. 이번 문제를 몇 주 동안
  #   못 보고 지나친 원인이 정확히 그거다. 트리거가 하나뿐이면 고장 시
  #   실행이 0이 되어 바로 드러난다. 감시는 cron-job.org의 실패 알림
  #   (응답이 2xx가 아니면 메일)이 맡는다.
  #
  # 문서: pipeline/PIPELINE.md 8-3
  workflow_dispatch:

# 앞 실행이 안 끝났는데 다음 호출이 들어오는 경우를 막는다.
# cancel-in-progress: false — 돌고 있던 수집은 끝까지 두고 새 것을 대기시킨다.
# (수집 도중에 끊으면 그 버킷이 반쪽만 남는다)
concurrency:
  group: pipeline-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 로컬 실측은 수십 초. 20분을 넘긴다면 어딘가 걸린 것이므로 끊는 게 맞다.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # 로컬 개발 버전(v22.12.0)과 맞춤
          cache: npm

      # --omit=dev — 파이프라인은 devDependencies(drizzle-kit·typescript·eslint)를
      # 전혀 쓰지 않는다. 필요한 건 postgres 하나뿐이고 dependencies에 있다.
      # (pipeline/**의 외부 import는 postgres와 @anthropic-ai/sdk 둘뿐이며 모두 지연 import)
      - run: npm ci --omit=dev

      # npm run collect가 아니라 node를 직접 부르는 이유 —
      # npm 스크립트에는 `--env-file=.env.local`이 붙어 있는데
      # .env.local은 gitignore라 러너에 존재하지 않는다. 그대로 부르면 실패한다.
      # 러너에서는 아래 env가 .env.local의 역할을 대신한다.
      - run: node pipeline/collect.mjs
        env:
          # Neon의 direct 문자열(호스트에 -pooler가 없는 것)을 넣을 것.
          # 매시간 프로세스 하나뿐이라 pooled가 필요 없다.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # 민감값이 아니라 secrets로 두지 않았다.
          REGION_CODE: KR
          # ★ ANTHROPIC_API_KEY를 일부러 주지 않는다.
          #   collect 경로에 LLM 호출이 섞여 들어오면 조용히 돌지 않고 바로 실패해서 드러난다.
