# DB 마이그레이션(drizzle)을 운영자가 직접 트리거해서 적용한다. (#109)
#
# ★ 왜 자동 배포(Render buildCommand/preDeployCommand)에 끼워 넣지 않았나.
#   이 레포의 마이그레이션엔 ADD COLUMN만 있던 게 아니라 DROP도 있었다
#   (drizzle/0003_drop_keyword_verdicts.sql). "머지하면 자동으로 적용"은
#   파괴적인 변경이 머지되는 순간 그대로 프로덕션에 반영된다는 뜻이라,
#   "언제 적용할지"를 사람이 더 이상 고를 수 없게 만든다. 그래서 collect.yml·
#   rank.yml과 같은 원칙(= workflow_dispatch, 사람이 버튼을 누른 것과 같은 취급)을
#   그대로 가져오되, 이쪽은 되돌리기 어려운 스키마 변경이라 한 겹 더 막는다:
#   GitHub Environment(`production`)에 필수 리뷰어를 걸어두면, 버튼을 눌러도
#   지정된 사람이 승인하기 전까진 DATABASE_URL 같은 시크릿에 접근도 안 되고 멈춰 있다.
#   (Settings → Environments → production → Required reviewers 에서 설정 — 이 워크플로
#   파일만으로는 그 승인 규칙이 생기지 않는다. 레포 설정은 사람이 직접 해야 한다.)
#
# ★ confirm 입력을 추가로 요구하는 이유.
#   "Run workflow" 버튼은 다른 워크플로(collect/rank)에도 똑같이 있다 — 레포에
#   workflow_dispatch가 여러 개면 잘못 누르기 쉽다. 환경 이름을 정확히 타이핑하게
#   해서, 적어도 "이게 DB 스키마를 바꾸는 버튼이다"를 누르는 사람이 한 번 더 보게 한다.
#
# ★ DATABASE_URL을 `secrets.DATABASE_URL`로 그대로 참조하는 이유.
#   collect.yml·rank.yml이 이미 같은 이름의 레포 시크릿(Neon direct 문자열)을 쓰고
#   있다. `environment: production`이 걸린 잡에서 같은 이름의 **environment** 시크릿을
#   따로 등록하면 그게 우선 적용되고, 등록하지 않으면 기존 레포 시크릿으로 자연히
#   폴백된다 — 당장 추가 설정 없이도 동작하고, 나중에 마이그레이션 전용 연결 문자열로
#   분리하고 싶으면 레포 설정에서 production environment에 같은 이름의 시크릿만
#   추가하면 된다(워크플로 파일은 안 고쳐도 됨).
#
# 문서: issue #109

name: db migrate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '정말 프로덕션 DB에 마이그레이션을 적용하려면 정확히 "migrate-production"을 입력'
        required: true

permissions:
  contents: read

# 마이그레이션이 겹쳐 돌면 안 된다 — drizzle-kit이 같은 DB에 동시에 두 번 적용 시도하는
# 상황 자체를 안 만든다.
concurrency:
  group: db-migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    # drizzle-kit이 내부적으로 트랜잭션을 안 쓰는 마이그레이션(DROP 등)에서 타임아웃에
    # 걸려 중간에 끊기면, 스키마는 바뀌었는데 __drizzle_migrations엔 기록이 안 남는
    # 반쪽 상태가 될 수 있다 — 그 복구는 수동이다(__drizzle_migrations 테이블과 실제
    # 스키마를 직접 대조). collect.yml·rank.yml과 같은 20분으로 맞춰 여유를 둔다.
    timeout-minutes: 20

    steps:
      # workflow_dispatch는 기본적으로 "Run workflow" 화면에서 아무 브랜치나 골라 실행할
      # 수 있다 — environment의 필수 리뷰어 승인은 "누군가 승인했다"만 보장하지 "어떤
      # 코드가 승인됐는지"는 승인 화면에 뚜렷이 안 드러난다. master가 아닌 브랜치(아직
      # 리뷰 안 된 마이그레이션이 섞여 있을 수 있는)에서 실행되는 걸 막는다.
      - name: master에서 실행됐는지 확인
        env:
          RUN_REF: ${{ github.ref }}
        run: |
          if [ "$RUN_REF" != "refs/heads/master" ]; then
            echo "::error::이 워크플로는 master에서만 실행할 수 있다. 선택된 ref: $RUN_REF"
            exit 1
          fi

      - name: confirm 입력값 확인
        # inputs.confirm을 run: 스크립트에 직접 문자열 치환하지 않는다 — 사람이 직접
        # 타이핑하는 값이라 공격 시나리오는 낮지만, "", $(), 백틱 같은 쉘 특수문자가
        # 섞이면 치환 방식에선 그대로 실행될 수 있다. env로 넘겨 변수로만 비교한다.
        env:
          CONFIRM_INPUT: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM_INPUT" != "migrate-production" ]; then
            echo "::error::confirm 입력이 'migrate-production'과 일치하지 않는다."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # drizzle-kit은 devDependencies라 --omit=dev를 쓰는 collect.yml·rank.yml과 달리
      # 전체 설치가 필요하다.
      - run: npm ci

      # 실제 DB에 손대기 전에 파일 정합성부터 확인한다(과거 사고: 0001 마이그레이션이
      # journal에 등록 안 돼서 db:migrate가 영원히 건너뛴 적이 있다 — scripts/verify-migrations.mjs 참고).
      - run: npm run verify:migrations

      # npm run db:migrate가 아니라 drizzle-kit을 직접 부른다 — 그 npm 스크립트는
      # `--env-file=.env.local`이 붙어 있는데 .env.local은 gitignore라 러너에 없다.
      # (collect.yml의 같은 이유와 동일)
      - run: node node_modules/drizzle-kit/bin.cjs migrate --config=drizzle.config.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
