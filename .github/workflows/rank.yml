# 쌓인 raw_signals에서 최근 6시간을 꺼내 키워드 순위를 계산하고
# trend_snapshots에 저장한다. (rank-popular.mjs --save)
#
# ★ Claude API를 쓰는 쪽은 여기다. verdict.mjs가 "이게 키워드가 맞나"를 LLM으로 판정한다.
#   앱이 개발 중인 동안은 비용을 아끼려고 2시간 주기로 둔다.
#   늦춰도 잃는 게 없다 — 원문(raw_signals)만 있으면 순위는 언제든 다시 계산된다.
#   (과거 전 구간 재계산: node pipeline/backfill-popular.mjs --reset, API 호출 0회)
#
#   나중에 앱을 공개해서 신선도가 중요해지면 cron을 "20 * * * *"(매시간)로 바꾸면 된다.
#   keyword_verdicts 캐시가 데워질수록 신규 판정 건수가 줄어 호출 비용도 함께 내려간다.
#
# 문서: pipeline/PIPELINE.md 8-3

name: rank (2h)

on:
  schedule:
    # 2시간마다 :20 (UTC).
    # collect가 :05에 돌기 때문에 15분 뒤로 밀어 두었다 — 같은 시각에 걸면
    # collect가 아직 쓰고 있는 버킷을 rank가 읽어 반쪽짜리 집계가 나온다.
    # 로컬 실측 수집 시간이 수십 초라 15분이면 충분한 여유다.
    - cron: "20 */2 * * *"

  # 수동 실행 버튼. 점수 공식을 손본 뒤 바로 돌려보는 용도.
  # ※ 이 버튼은 워크플로 파일이 기본 브랜치(master)에 있어야 UI에 나타난다.
  workflow_dispatch:

concurrency:
  group: pipeline-rank
  cancel-in-progress: false

jobs:
  rank:
    runs-on: ubuntu-latest
    # LLM 판정이 후보 수만큼 붙어서 collect보다 오래 걸린다.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # @anthropic-ai/sdk는 dependencies에 있다(verdict.mjs가 지연 import).
      # devDependencies는 파이프라인이 쓰지 않으므로 제외한다.
      - run: npm ci --omit=dev

      # --save가 붙어야 DB에 쓴다. 빼면 계산해서 로그로 출력만 하고 끝난다.
      # (점수 공식을 실험할 때 쓰는 안전장치라 여기서는 반드시 붙인다)
      - run: node pipeline/rank-popular.mjs --save
        env:
          # collect.yml과 같은 Neon direct 문자열.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # YOUTUBE_API_KEY는 필요 없다 — rank는 수집을 하지 않고 DB만 읽는다.
