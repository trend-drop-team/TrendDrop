name: Gemini request diagnostic
on:
  workflow_dispatch:
    inputs:
      expected_key_sha256:
        description: Local key digest for equality check only
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node pipeline/experiments/gemini-diagnostic.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXPECTED_KEY_SHA256: ${{ inputs.expected_key_sha256 }}
