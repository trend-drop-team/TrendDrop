name: Gemini request diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node pipeline/experiments/gemini-diagnostic.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
